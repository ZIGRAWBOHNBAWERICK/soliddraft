name: Shared Rust compilation cache
description: Cache individual compiler outputs on GitHub across ephemeral runners
runs:
  using: composite
  steps:
    - uses: ./.github/actions/pinned-tool
      with:
        tool: sccache
    - uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - shell: bash
      env:
        CACHE_VERSION: ${{ hashFiles('Cargo.lock', 'crates/soliddraft-kernel-catallax/Cargo.toml') }}
      run: |
        echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
        echo 'SCCACHE_GHA_ENABLED=on' >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_VERSION=soliddraft-v1-$CACHE_VERSION" >> "$GITHUB_ENV"
        echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo 'SCCACHE_IDLE_TIMEOUT=60' >> "$GITHUB_ENV"
        echo "SCCACHE_SERVER_UDS=$RUNNER_TEMP/sccache-$GITHUB_JOB.sock" >> "$GITHUB_ENV"
