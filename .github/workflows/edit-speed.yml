name: Edit speed

# Paired click timing for changes on the rebuild path. It reports medians and fails only
# when an answer differs; wall-clock budgets stay advisory.
on:
  pull_request:
    paths:
      - 'crates/soliddraft-kernel-api/**'
      - 'crates/soliddraft-kernel-catallax/**'
      - 'crates/soliddraft-model/**'
      - 'ci/edit_speed.py'
      - '.github/workflows/edit-speed.yml'

permissions:
  contents: read

concurrency:
  group: edit-speed-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  pairs:
    name: Paired edit timing
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: '1'
      XDG_RUNTIME_DIR: /tmp/edit-speed-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Read the pull request's fork point and pinned Catallax revision
        id: revisions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "base=$(git merge-base "$PR_BASE" "$PR_HEAD")" >> "$GITHUB_OUTPUT"
          echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          revision=$(sed -n 's/^pub const CATALLAX_REVISION: &str = "\(.*\)";/\1/p' crates/soliddraft-kernel-catallax/src/lib.rs)
          test -n "$revision"
          echo "catallax=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: BohnBawerick/catallax
          ref: ${{ steps.revisions.outputs.catallax }}
          path: .ci-catallax
          persist-credentials: false
      - name: Install the software Vulkan adapter
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends mesa-vulkan-drivers
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Build the verifier and both application revisions
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: |
          cp ci/edit_speed.py "$RUNNER_TEMP/edit_speed.py"
          cargo build --release --locked --manifest-path .ci-catallax/Cargo.toml -p catallax-cli --bin catallax-verify --target-dir target
          cp target/release/catallax-verify "$RUNNER_TEMP/catallax-verify"
          python3 "$RUNNER_TEMP/edit_speed.py" build --app . --binaries "$RUNNER_TEMP/edit-binaries"
      - name: Pair the five edits and compare every answer
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: python3 ci/edit_speed.py run --app . --binaries "$RUNNER_TEMP/edit-binaries" --verifier "$RUNNER_TEMP/catallax-verify" --out "$RUNNER_TEMP/edit-speed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edit-speed
          path: ${{ runner.temp }}/edit-speed
          if-no-files-found: warn
