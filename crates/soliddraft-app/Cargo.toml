[package]
name = "soliddraft-app"
description = "SolidDraft: the desktop application. Tool palette, options bar, history, command line, assistant session and the wgpu viewport."
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "soliddraft-app"

[lib]
name = "soliddraft_app"
path = "src/lib.rs"

[[bin]]
name = "soliddraft-app"
path = "src/main.rs"

[dependencies]
soliddraft-assembly.workspace = true
soliddraft-kernel-api.workspace = true
soliddraft-kernel-catallax.workspace = true
soliddraft-model.workspace = true
soliddraft-tessellation.workspace = true
soliddraft-sketch.workspace = true
soliddraft-document.workspace = true
soliddraft-materials.workspace = true
soliddraft-drawing.workspace = true
soliddraft-exchange.workspace = true
kurbo.workspace = true
toml.workspace = true
serde.workspace = true
soliddraft-assistant.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
wgpu.workspace = true
glam.workspace = true
half = "2.7.1"
# Dates in local time for the start page and Recover documents; the browser's clock on the web.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
bytemuck.workspace = true
log.workspace = true
image.workspace = true
serde_json.workspace = true
web-time.workspace = true
resvg.workspace = true
zip.workspace = true
quick-xml.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
rfd.workspace = true
# Scene import reads files from disk; the browser build has none to read.
soliddraft-scene.workspace = true

# The web build: Catallax runs locally; assistant calls use the server (docs/web.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# The DXF writer makes uuids, which need the browser's random source on this target.
uuid = { version = "1.26.1", features = ["js"] }
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "Crypto",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "File",
    "FileList",
    "Headers",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "Window",
    "XmlHttpRequest",
] }

[dev-dependencies]
proptest.workspace = true
soliddraft-kernel-api = { workspace = true, features = ["counting"] }
soliddraft-recipe.workspace = true
egui_kittest.workspace = true
lopdf = "0.45.0"
# The version wgpu uses, to check the viewport shader translates to WebGL2's GLSL.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }
pollster.workspace = true

[lints]
workspace = true
