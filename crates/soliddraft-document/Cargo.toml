[package]
name = "soliddraft-document"
description = "The SolidDraft document envelope: document ids, the manifest, canonical hashes, references between documents, the resolver, the folder index, the revision store, File locations and atomic saves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = { version = "1.8.2", default-features = false, features = ["std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid = { version = "1.26.1", features = ["v4", "v8", "serde"] }
# The browser has no std clock; on the desktop these are std's own types.
web-time.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4.3"

# Random ids in the browser come from its crypto source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.1", features = ["js"] }

[lints]
workspace = true
