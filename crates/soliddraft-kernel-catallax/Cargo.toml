[package]
name = "soliddraft-kernel-catallax"
description = "SolidDraft kernel interface on Catallax's application entry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
soliddraft-kernel-api.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
catallax-import = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-app = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-mesh = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-numbers = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-topology = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-recipe = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-shapes = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-measure = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-iges = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-step = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }

catallax-field = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
catallax-features = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }

catallax-compare = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }

[features]
# Builds of chosen operations come back as numerical bodies, standing in for Catallax's
# numerical results in tests until Catallax returns them itself.
numerical-stand-in = []

[dev-dependencies]
catallax-boolean = { git = "https://github.com/BohnBawerick/catallax", rev = "6aac740b4e8cf70c2ada3749fda5cc3f0f8d1062" }
soliddraft-model.workspace = true
soliddraft-recipe.workspace = true
soliddraft-kernel-api = { workspace = true, features = ["contract"] }

[[test]]
name = "numerical_bodies"
required-features = ["numerical-stand-in"]

[lints]
workspace = true
