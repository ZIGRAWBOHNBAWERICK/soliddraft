[package]
name = "soliddraft-kernel-catallax"
description = "SolidDraft kernel interface on Catallax's application entry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
soliddraft-kernel-api.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
catallax-import = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-app = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-mesh = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-numbers = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-topology = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-recipe = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-shapes = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-measure = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-iges = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-step = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }

catallax-field = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
catallax-features = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }

catallax-compare = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
# The unproved GPU preview mesher, on the renderer's own wgpu device.
catallax-preview = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
wgpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["time"] }

[features]
# Builds of chosen operations come back as numerical bodies, standing in for Catallax's
# numerical results in tests until Catallax returns them itself.
numerical-stand-in = []

[dev-dependencies]
catallax-boolean = { git = "https://github.com/BohnBawerick/catallax", rev = "cc5f5786a117675cbb248e007f9f809298e8d4a9" }
soliddraft-model.workspace = true
soliddraft-recipe.workspace = true
soliddraft-kernel-api = { workspace = true, features = ["contract"] }

[[test]]
name = "numerical_bodies"
required-features = ["numerical-stand-in"]

[lints]
workspace = true
