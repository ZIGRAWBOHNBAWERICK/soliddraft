[package]
name = "soliddraft-scene"
description = "SolidDraft scene import: OpenUSD, glTF/GLB, URDF, OBJ and STL read into one named tree of mesh bodies, in millimetres with Z up, keeping transforms, materials and joints where the format carries them."
version.workspace = true
edition.workspace = true
# openusd needs 1.96; the crate is outside the MSRV check, like the app.
rust-version = "1.96"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
glam.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils", "extras"] }
openusd = "0.8.0"
openusd-schemas = { version = "0.8.0", features = ["geom", "shade"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
soliddraft-assembly.workspace = true
soliddraft-document.workspace = true
soliddraft-materials.workspace = true
stl_io = "0.11.0"
thiserror.workspace = true
tobj = { version = "4.0.5", default-features = false }
urdf-rs = "0.10.0"

[lints]
workspace = true
